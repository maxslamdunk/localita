# The benchmark results Worker. See README.md for setting it up.
name = "turbo-fieldfare-bench"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false
send_metrics = false

# No request logs: they would hold senders' addresses.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "turbo-fieldfare-bench"
# From `wrangler d1 create` (2026-10-15). Local runs ignore it.
database_id = "3bd9972f-dc91-47ad-a5bc-5baa10257386"
migrations_dir = "migrations"

# Ten reports a minute from one address. Counts are kept per Cloudflare
# location and are approximate, which is enough to stop a loop.
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
