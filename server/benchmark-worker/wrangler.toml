# The benchmark results Worker. See README.md for setting it up.
name = "turbo-fieldfare-bench"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# No request logs: they would hold senders' addresses.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "turbo-fieldfare-bench"
# Replaced with the ID `wrangler d1 create` prints. Local runs ignore it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Ten reports a minute from one address. Counts are kept per Cloudflare
# location and are approximate, which is enough to stop a loop.
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
