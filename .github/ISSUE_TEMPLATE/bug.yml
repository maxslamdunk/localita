name: Bug report
description: Report something that goes wrong in the app or the engine.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Leave out credentials, private paths, model weights, and chat text you would not want to be public.
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - iPhone app
        - Mac app, command-line tool or server
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and memory
      placeholder: iPhone 17, 8 GB
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: iOS or macOS version
      placeholder: iOS 26.6
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit SHA you built.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model build
      description: Which model is installed, from the app's Models screen, or the Hugging Face link you added.
      placeholder: Gemma 4, with image support
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, prompt or command that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include screenshots, or logs with personal details removed, when they help.
    validations:
      required: true
