name: Feature proposal
description: Propose a focused improvement to the app, the engine or the tooling.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The concrete limitation or use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest useful version of it, and what it touches.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or measurements
      description: For a speed idea, a rough estimate of the gain, and any measurements or references. AGENTS.md describes where the time goes on the phone.
  - type: textarea
    id: memory
    attributes:
      label: Memory
      description: For an engine change, how it stays inside the phone's memory budget (about 4.3 GB for the app) without loading whole shards or tensors.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
