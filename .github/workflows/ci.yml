name: CI

# Changes that cannot reach the Mac build or tests skip CI: the results
# Worker (it has its own node tests), everything under results/, and exported
# submissions. Markdown anywhere still runs, for the link check.
# Later patterns override earlier ones; keep the two lists the same.
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!server/**'
      - '!results/**'
      - '!benchmark-submissions/**'
      - '**/*.md'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    paths:
      - '**'
      - '!server/**'
      - '!results/**'
      - '!benchmark-submissions/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The runner's default Xcode is the newest on the image, so this job alone
  # never exercised the oldest toolchain the README supports. Three Swift 6.2
  # build breaks shipped in 0.5.0 behind that gap.
  build-oldest-supported-toolchain:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the oldest supported Xcode
        run: |
          app=$(ls -d /Applications/Xcode_26.3*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "Xcode 26.3 is not on this runner image; available:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$app"
      - name: Report the toolchain
        run: swift --version
      - name: Check SwiftUI macro independence
        run: |
          ruby Scripts/check_swiftui_macros.rb --self-test
          ruby Scripts/tests/swift_macro_probe_test.rb
      - name: Build release products
        run: swift build -c release
      - name: Build debug and test state compatibility
        run: Scripts/test.sh --filter 'StoredStateTests|AppModelTests|DecodeServiceLaunchPolicyTests'

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # macos-26's default SDK does not exercise the new State macro.
    # Official preview runner: actions/runner-images#14404.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Report the toolchain
        run: swift --version
      - name: Check SwiftUI macro independence
        run: |
          ruby Scripts/check_swiftui_macros.rb --self-test
          ruby Scripts/tests/swift_macro_probe_test.rb --require-sdk-27
      - name: Build release without SwiftUI platform plugins
        run: ruby Scripts/tests/swift_macro_probe_test.rb --require-sdk-27 --build release
      - name: Build debug without SwiftUI platform plugins
        run: ruby Scripts/tests/swift_macro_probe_test.rb --require-sdk-27 --build debug
      - name: Run serial tests
        run: Scripts/test.sh
      - name: Check for tracked symlinks
        run: ruby Scripts/check_tracked_symlinks.rb
      - name: Check Markdown links
        run: ruby Scripts/check_markdown_links.rb
      # Upstream's releases set this version, so in this repo falling behind
      # means an upstream merge is due, not that this push broke anything.
      # It warns instead of failing.
      - name: Check the app version against upstream's latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ruby Scripts/check_app_version.rb ||
            echo "::warning title=Behind upstream::The app version is behind drumih/turbo-fieldfare's latest release; merge upstream and update fallbackShortVersion."
